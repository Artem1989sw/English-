<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">

<title>Англійська A2–B1 — теорія та лексика</title>
<style>
html, body{ height:100%; margin:0; }
body{ background:#FAF6EF; }
body:has(.eq-root[data-theme="dark"]){ background:#141A24; }
:root{ --ink:#1F2A38; --paper:#FAF6EF; --card:#FFFFFF; --card-alt:#F2EEE4; --line:#DCD3C0; --navy:#2E4057; --navy-solid:#2E4057; --gold:#B08D2B; --good:#3F7A54; --good-bg:#EEF6F0; --bad:#B0413E; --bad-bg:#FBEEED; --muted:#6B6459; --purple:#7A5EA8; }
*{box-sizing:border-box;}
.eq-root{ font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif; color:var(--ink); background:var(--paper); padding:64px 18px 60px; max-width:720px; min-height:100vh; margin:0 auto; position:relative; transition:background-color .2s ease, color .2s ease; }
.eq-root[data-theme="dark"]{ --ink:#E7E1D3; --paper:#141A24; --card:#1E2734; --card-alt:#242F3E; --line:#2C3849; --navy:#6C93C4; --navy-solid:#3E6690; --gold:#E3C567; --good:#5FBE82; --good-bg:#1D3327; --bad:#E2827E; --bad-bg:#3A2323; --muted:#93A1B5; --purple:#A78BD1; }
.eq-top{ position:absolute; top:16px; right:18px; display:flex; justify-content:flex-end; gap:8px; }
.eq-icon-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; text-decoration:none; }
.eq-icon-btn:hover{ border-color:var(--gold); }
.eq-kicker{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:12.5px; letter-spacing:.04em; color:var(--muted); margin:0 0 4px; }
.eq-title{ font-size:28px; font-weight:600; margin:0 0 22px; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:16px; }
.eq-tabs{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
.eq-tab{ flex:1 1 100px; text-align:center; padding:10px 12px; font-size:13.5px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; }
.eq-tab.active{ border-color:var(--navy-solid); background:var(--navy-solid); color:#fff; font-weight:600; }
.eq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:480px){ .eq-grid{grid-template-columns:1fr;} }
.eq-tile{ font-family:"Helvetica Neue",Arial,sans-serif; text-align:left; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--navy); padding:14px 16px; cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
.eq-tile:hover{ border-left-color:var(--gold); transform:translateX(2px); }
.eq-tile-name{ font-size:16px; font-weight:600; color:var(--navy); margin-bottom:3px; }
.eq-tile-count{ font-size:12.5px; color:var(--muted); }
.eq-back{ background:none; border:none; color:var(--navy); cursor:pointer; font-size:13px; padding:0; font-family:inherit; text-decoration:underline; margin-bottom:18px; display:inline-block; }
.eq-dirtoggle{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.eq-dirtoggle .eq-dirbtn{ flex:1 1 60px; }
.eq-dirbtn{ flex:1; text-align:center; padding:11px 14px; font-size:13.5px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; }
.eq-dirbtn.active{ border-color:var(--navy-solid); background:var(--navy-solid); color:#fff; font-weight:600; }
.eq-topbar{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:10px; }
.eq-progressbar{ height:3px; background:var(--line); margin-bottom:26px; }
.eq-progressbar-fill{ height:3px; background:var(--gold); transition:width .25s ease; }
.eq-prompt-label{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:12.5px; color:var(--muted); margin-bottom:8px; }
.eq-prompt{ font-size:32px; line-height:1.25; margin:0 0 8px; color:var(--ink); }
.eq-speak{ font-family:"Helvetica Neue",Arial,sans-serif; display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--navy); color:var(--navy); padding:7px 13px; font-size:13px; cursor:pointer; margin-bottom:24px; }
.eq-speak:hover{ background:var(--navy-solid); color:#fff; }
.eq-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
@media (max-width:480px){ .eq-options{grid-template-columns:1fr;} }
.eq-opt{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:16px; text-align:left; background:var(--card); border:1px solid var(--line); padding:13px 14px; cursor:pointer; color:var(--ink); }
.eq-opt:hover:not(:disabled){ border-color:var(--navy); }
.eq-opt:disabled{ cursor:default; }
.eq-opt.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); font-weight:600; }
.eq-opt.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); font-weight:600; }
.eq-nextbar{ display:flex; justify-content:flex-end; margin-top:16px; }
.eq-next{ font-family:"Helvetica Neue",Arial,sans-serif; background:var(--navy-solid); color:#fff; border:none; padding:11px 22px; font-size:14px; cursor:pointer; }
.eq-next:disabled{ opacity:.35; cursor:default; }
.eq-summary-score{ font-size:44px; font-weight:600; color:var(--navy); text-align:center; margin:20px 0 28px; }
.eq-missed-title{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; color:var(--muted); margin-bottom:10px; }
.eq-missed-item{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; justify-content:space-between; padding:9px 12px; background:var(--card-alt); margin-bottom:6px; font-size:14.5px; }
.eq-btnrow{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
.eq-btn-primary{ font-family:"Helvetica Neue",Arial,sans-serif; background:var(--navy-solid); color:#fff; border:none; padding:12px 20px; font-size:14px; cursor:pointer; flex:1 1 auto; }
.eq-btn-secondary{ font-family:"Helvetica Neue",Arial,sans-serif; background:var(--card); color:var(--ink); border:1px solid var(--line); padding:12px 20px; font-size:14px; cursor:pointer; flex:1 1 auto; }
.eq-theory-list-item{ font-family:"Helvetica Neue",Arial,sans-serif; display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); padding:14px 16px; margin-bottom:10px; cursor:pointer; font-size:15px; color:var(--ink); }
.eq-theory-list-item:hover{ border-left-color:var(--navy); }
.eq-theory-article h3{ color:var(--navy); font-size:20px; margin:26px 0 10px; }
.eq-theory-article h3:first-child{ margin-top:0; }
.eq-theory-article p{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:15.5px; line-height:1.65; margin:0 0 12px; }
.eq-theory-article ul{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:15.5px; line-height:1.65; margin:0 0 14px; padding-left:20px; }
.eq-theory-article li{ margin-bottom:6px; }
.eq-ex{ display:block; background:var(--card-alt); border-left:3px solid var(--gold); padding:8px 12px; margin:4px 0 10px; font-size:14.5px; }
.eq-ex b{ color:var(--navy); }
.eq-ex i{ color:var(--muted); font-style:normal; }
.eq-study-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
.eq-study-item{ font-family:"Helvetica Neue",Arial,sans-serif; display:grid; grid-template-columns:1fr 1fr auto; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); padding:11px 14px; }
.eq-study-front{ font-size:16px; font-weight:600; color:var(--navy); }
.eq-study-back{ font-size:15px; color:var(--ink); }
.eq-study-speak{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card-alt); cursor:pointer; font-size:13px; padding:0; }
.eq-study-speak:hover{ border-color:var(--navy); }
@media (max-width:480px){ .eq-study-item{ grid-template-columns:1fr auto; } .eq-study-back{ grid-column:1 / 2; color:var(--muted); font-size:13.5px; } }
.eq-topbar-right{ display:flex; align-items:center; gap:10px; }
.eq-star{ background:none; border:none; cursor:pointer; padding:0; line-height:1; font-size:19px; color:var(--muted); }
.eq-star.active{ color:var(--gold); }
.eq-search{ font-family:"Helvetica Neue",Arial,sans-serif; width:100%; font-size:15px; padding:12px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); margin-bottom:10px; }
.eq-search:focus{ outline:none; border-color:var(--navy); }
.eq-dict-count{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:12.5px; color:var(--muted); margin:0 0 16px; }
.eq-dict-item{ grid-template-columns:1fr 1fr auto; }
.eq-dict-actions{ display:flex; align-items:center; gap:10px; }
.eq-pos-tag{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:2px; padding:1px 6px; }
.eq-reading-ua{ color:var(--muted); font-style:italic; margin-top:-8px !important; }
.eq-streak-box{ display:flex; flex-direction:column; align-items:center; margin:10px 0 4px; }
.eq-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:26px; font-family:"Helvetica Neue",Arial,sans-serif; }
.eq-cal-head{ text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
.eq-cal-pad{ }
.eq-cal-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12.5px; border:1px solid var(--line); color:var(--muted); background:var(--card); }
.eq-cal-cell.active{ background:var(--gold); color:#fff; font-weight:600; border-color:var(--gold); }
.eq-cal-cell.today{ border-color:var(--navy); border-width:2px; }
.eq-progress-section{ margin-bottom:28px; }
.eq-level-badge{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:2px; color:#fff; white-space:nowrap; }
.eq-level-badge.lvl-a1{ background:var(--good); }
.eq-level-badge.lvl-a2{ background:var(--gold); }
.eq-level-badge.lvl-b1{ background:var(--navy-solid); }
.eq-level-badge.lvl-b2{ background:var(--bad); }
.eq-level-badge.lvl-c1{ background:var(--purple); }
.eq-study-front-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.eq-theory-list-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.eq-title-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:22px; }
.eq-title-row .eq-title{ border-bottom:none; margin-bottom:0; padding-bottom:0; flex:1; }
.eq-reading-list-item{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); padding:14px 16px; margin-bottom:10px; cursor:pointer; font-size:15px; color:var(--ink); }
.eq-reading-list-item:hover{ border-left-color:var(--navy); }
</style>

  // ---------- progress: favorites, mistakes, streak (localStorage) ----------
  const PROGRESS_KEY = "eq-progress-v1";
  function loadProgress(){
    try{
      const raw = localStorage.getItem(PROGRESS_KEY);
      if(!raw) return {days:{}, favorites:[], mistakes:{}};
      const parsed = JSON.parse(raw);
      return {days: parsed.days || {}, favorites: parsed.favorites || [], mistakes: parsed.mistakes || {}};
    }catch(e){
      return {days:{}, favorites:[], mistakes:{}};
    }
  }
  const progress = loadProgress();
  function saveProgress(){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }

  function dateKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function recordActivity(){ progress.days[dateKey(new Date())] = true; saveProgress(); }
  function computeStreak(){
    let streak = 0;
    const d = new Date();
    if(!progress.days[dateKey(d)]) d.setDate(d.getDate() - 1);
    while(progress.days[dateKey(d)]){
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }
  function totalPracticeDays(){ return Object.keys(progress.days).length; }

  function wordId(it){ return it[0].toLowerCase(); }
  function isFavorite(it){ return progress.favorites.indexOf(wordId(it)) !== -1; }
  function toggleFavorite(it){
    const id = wordId(it);
    const idx = progress.favorites.indexOf(id);
    if(idx === -1) progress.favorites.push(id); else progress.favorites.splice(idx,1);
    saveProgress();
  }
  function favoriteItems(){
    return DICTIONARY.filter(it=> progress.favorites.indexOf(wordId(it)) !== -1);
  }
  function recordMistake(it){
    const id = wordId(it);
    progress.mistakes[id] = (progress.mistakes[id]||0) + 1;
    saveProgress();
  }
  function mistakeItems(){
    return Object.keys(progress.mistakes)
      .map(id=> ({id, count: progress.mistakes[id], item: DICTIONARY.find(it=> wordId(it) === id)}))
      .filter(x=> x.item)
      .sort((a,b)=> b.count - a.count)
      .slice(0, 30)
      .map(x=> x.item);
  }

      <p>Дієслово <b>to be</b> — найважливіше дієслово в англійській мові. Воно змінюється залежно від займенника:</p>
      <ul>
        <li><b>I am</b> (I'm) — я є</li>
        <li><b>he / she / it is</b> (he's, she's, it's)</li>
        <li><b>you / we / they are</b> (you're, we're, they're)</li>
      </ul>
      <span class="eq-ex"><b>I am a student.</b> <i>— Я студент.</i></span>
      <span class="eq-ex"><b>She is happy.</b> <i>— Вона щаслива.</i></span>
      <p>Заперечення утворюється додаванням <b>not</b>: <i>I am not</i>, <i>he is not (isn't)</i>, <i>they are not (aren't)</i>.</p>
      <p>Питання: змінюємо порядок слів — <b>Are you tired?</b>, <b>Is he at home?</b></p>
    `},
    {title:"Present Simple — теперішній простий час", level:"A1", body:`
      <p>Використовується для звичок, фактів і розкладу.</p>
      <ul>
        <li>Стверджувальна форма: <b>I / you / we / they + дієслово</b>; <b>he / she / it + дієслово + -s</b></li>
        <li>Заперечення: <b>don't / doesn't + дієслово</b></li>
        <li>Питання: <b>Do / Does + підмет + дієслово?</b></li>
      </ul>
      <span class="eq-ex"><b>I work every day.</b> <i>— Я працюю щодня.</i></span>
      <span class="eq-ex"><b>She doesn't like coffee.</b> <i>— Вона не любить каву.</i></span>
      <span class="eq-ex"><b>Do you speak English?</b> <i>— Ти розмовляєш англійською?</i></span>
      <p>Слова-маркери: always, usually, often, sometimes, never, every day.</p>
    `},
    {title:"Present Continuous — теперішній тривалий час", level:"A1", body:`
      <p>Використовується для дій, які відбуваються прямо зараз, або запланованих подій у майбутньому.</p>
      <p>Форма: <b>am / is / are + дієслово + -ing</b></p>
      <span class="eq-ex"><b>I am reading a book now.</b> <i>— Я зараз читаю книгу.</i></span>
      <span class="eq-ex"><b>They are not watching TV.</b> <i>— Вони не дивляться телевізор.</i></span>
      <span class="eq-ex"><b>Is she working today?</b> <i>— Вона працює сьогодні?</i></span>
      <p>Слова-маркери: now, at the moment, right now, today, Look!, Listen!</p>
    `},
    {title:"Past Simple — минулий простий час", level:"A2", body:`
      <p>Використовується для завершених дій у минулому.</p>
      <ul>
        <li>Правильні дієслова: +<b>-ed</b> (work → worked, play → played)</li>
        <li>Неправильні дієслова мають окрему форму (go → went, see → saw, have → had)</li>
        <li>Заперечення: <b>did not (didn't) + дієслово</b> (базова форма)</li>
        <li>Питання: <b>Did + підмет + дієслово?</b></li>
      </ul>
      <span class="eq-ex"><b>I visited Paris last year.</b> <i>— Я відвідав Париж торік.</i></span>
      <span class="eq-ex"><b>She didn't call me.</b> <i>— Вона мені не дзвонила.</i></span>
      <span class="eq-ex"><b>Did you see that film?</b> <i>— Ти бачив цей фільм?</i></span>
      <p>Слова-маркери: yesterday, last week/year, ago, in 2015.</p>
    `},
    {title:"Артиклі a / an / the", level:"A1", body:`
      <p><b>a / an</b> — неозначений артикль, вживається з обчислюваними іменниками в однині, коли предмет називається вперше або не конкретизується.</p>
      <ul>
        <li><b>a</b> — перед приголосним звуком: <i>a book, a car</i></li>
        <li><b>an</b> — перед голосним звуком: <i>an apple, an hour</i></li>
      </ul>
      <p><b>the</b> — означений артикль, коли предмет вже відомий обом співрозмовникам, єдиний у своєму роді, або згадувався раніше.</p>
      <span class="eq-ex"><b>I have a dog. The dog is black.</b> <i>— У мене є собака. Собака чорна.</i></span>
      <p>Артикль не вживається з незлічуваними іменниками у загальному значенні (water, love) та більшістю власних назв.</p>
    `},
    {title:"Множина іменників", level:"A1", body:`
      <p>Більшість іменників утворюють множину додаванням <b>-s</b>: book → books, car → cars.</p>
      <ul>
        <li>Після -s, -sh, -ch, -x, -o додається <b>-es</b>: box → boxes, watch → watches</li>
        <li>Після приголосної + y: y → ies: city → cities</li>
        <li>Винятки: man → men, woman → women, child → children, foot → feet, tooth → teeth, person → people</li>
      </ul>
      <span class="eq-ex"><b>There are three children in the room.</b> <i>— У кімнаті троє дітей.</i></span>
    `},
    {title:"Займенники", level:"A1", body:`
      <p>Особові займенники (підмет): I, you, he, she, it, we, they.</p>
      <p>Об'єктні займенники (додаток): me, you, him, her, it, us, them.</p>
      <p>Присвійні прикметники: my, your, his, her, its, our, their.</p>
      <p>Присвійні займенники: mine, yours, his, hers, ours, theirs.</p>
      <span class="eq-ex"><b>This is my book. It is mine.</b> <i>— Це моя книга. Вона моя.</i></span>
      <span class="eq-ex"><b>She gave the ball to him.</b> <i>— Вона віддала м'яч йому.</i></span>
    `},
    {title:"Прийменники місця та часу", level:"A2", body:`
      <p><b>Час:</b></p>
      <ul>
        <li><b>at</b> — точний час: at 5 o'clock, at night</li>
        <li><b>on</b> — дні: on Monday, on my birthday</li>
        <li><b>in</b> — місяці, роки, пори року: in May, in 2024, in summer</li>
      </ul>
      <p><b>Місце:</b></p>
      <ul>
        <li><b>at</b> — конкретна точка: at home, at the station</li>
        <li><b>on</b> — поверхня: on the table, on the wall</li>
        <li><b>in</b> — простір/приміщення: in the room, in London</li>
      </ul>
      <span class="eq-ex"><b>The book is on the table in the living room.</b> <i>— Книга на столі у вітальні.</i></span>
    `},
    {title:"Прикметники: порівняння", level:"A2", body:`
      <p>Короткі прикметники (1 склад): +<b>-er / -est</b>: small → smaller → the smallest.</p>
      <p>Довгі прикметники (2+ склади): <b>more / the most</b>: beautiful → more beautiful → the most beautiful.</p>
      <p>Винятки: good → better → the best; bad → worse → the worst; far → farther → the farthest.</p>
      <span class="eq-ex"><b>This car is faster than that one.</b> <i>— Ця машина швидша за ту.</i></span>
      <span class="eq-ex"><b>She is the most intelligent student.</b> <i>— Вона найрозумніша учениця.</i></span>
    `},
    {title:"Модальні дієслова can, must, should", level:"A2", body:`
      <ul>
        <li><b>can</b> — вміння, можливість, дозвіл: <i>I can swim.</i> (Я вмію плавати.)</li>
        <li><b>must</b> — обов'язок, необхідність: <i>You must wear a seatbelt.</i> (Ви повинні пристебнутися.)</li>
        <li><b>should</b> — порада: <i>You should study more.</i> (Тобі варто більше вчитися.)</li>
      </ul>
      <p>Після модальних дієслів дієслово завжди у базовій формі без <b>to</b>. Заперечення: can't, mustn't, shouldn't.</p>
      <span class="eq-ex"><b>You mustn't smoke here.</b> <i>— Тут не можна курити.</i></span>
    `},
    {title:"Питальні слова", level:"A1", body:`
      <ul>
        <li><b>What</b> — що/який</li>
        <li><b>Where</b> — де</li>
        <li><b>When</b> — коли</li>
        <li><b>Why</b> — чому</li>
        <li><b>How</b> — як</li>
        <li><b>Who</b> — хто</li>
        <li><b>Which</b> — котрий</li>
        <li><b>How much / How many</b> — скільки</li>
      </ul>
      <span class="eq-ex"><b>Where do you live?</b> <i>— Де ти живеш?</i></span>
      <span class="eq-ex"><b>How much does it cost?</b> <i>— Скільки це коштує?</i></span>
    `},
    {title:"There is / There are", level:"A1", body:`
      <p>Конструкція для позначення наявності чогось.</p>
      <ul>
        <li><b>There is</b> + однина / незлічуваний іменник</li>
        <li><b>There are</b> + множина</li>
      </ul>
      <span class="eq-ex"><b>There is a cat in the garden.</b> <i>— У саду є кіт.</i></span>
      <span class="eq-ex"><b>There are five books on the shelf.</b> <i>— На полиці п'ять книг.</i></span>
      <p>Заперечення: There isn't / There aren't. Питання: Is there...? / Are there...?</p>
    `},
    {title:"Майбутній час: going to та will", level:"A2", body:`
      <p><b>be going to</b> — заплановані дії або очевидні прогнози:</p>
      <span class="eq-ex"><b>I am going to visit my parents.</b> <i>— Я збираюся відвідати батьків.</i></span>
      <p><b>will</b> — рішення, прийняті в момент розмови, обіцянки, прогнози без доказів:</p>
      <span class="eq-ex"><b>I think it will rain tomorrow.</b> <i>— Думаю, завтра піде дощ.</i></span>
      <p>Заперечення: won't (will not), not going to.</p>
    `},
    {title:"Кількісні слова: some / any / much / many / a lot of", level:"B1", body:`
      <ul>
        <li><b>some</b> — у стверджувальних реченнях: I have some money.</li>
        <li><b>any</b> — у заперечних і питальних: I don't have any money. Do you have any questions?</li>
        <li><b>much</b> — з незлічуваними: How much water?</li>
        <li><b>many</b> — зі злічуваними: How many books?</li>
        <li><b>a lot of</b> — з обома типами в стверджувальних реченнях: I have a lot of friends.</li>
      </ul>
    `},
    {title:"Present Perfect", level:"B1", body:`
      <p>Використовується для дій у минулому, результат яких важливий зараз, або для досвіду без вказівки точного часу.</p>
      <p>Форма: <b>have/has + дієслово-3 (Past Participle)</b>.</p>
      <span class="eq-ex"><b>I have visited London twice.</b> <i>— Я двічі відвідував Лондон.</i></span>
      <span class="eq-ex"><b>She has just finished her homework.</b> <i>— Вона щойно закінчила домашнє завдання.</i></span>
      <span class="eq-ex"><b>Have you ever tried sushi?</b> <i>— Ти коли-небудь пробував суші?</i></span>
      <p>Слова-маркери: ever, never, just, already, yet, since, for.</p>
    `},
    {title:"Present Perfect чи Past Simple?", level:"B1", body:`
      <p><b>Present Perfect</b> — коли час дії не вказаний, а важливий результат чи зв'язок із теперішнім.</p>
      <p><b>Past Simple</b> — коли вказано конкретний час у минулому (yesterday, last year, in 2020).</p>
      <span class="eq-ex"><b>I have lost my keys.</b> <i>— Я загубив ключі (і досі їх не маю).</i></span>
      <span class="eq-ex"><b>I lost my keys yesterday.</b> <i>— Я загубив ключі вчора (конкретний момент).</i></span>
      <p>Порівняйте: <i>have been</i> (був і повернувся) проти <i>have gone</i> (пішов і ще там).</p>
    `},
    {title:"Past Continuous — минулий тривалий час", level:"B1", body:`
      <p>Використовується для дії, яка тривала в певний момент у минулому, часто перерваної іншою дією.</p>
      <p>Форма: <b>was/were + дієслово + -ing</b>.</p>
      <span class="eq-ex"><b>I was watching TV when the phone rang.</b> <i>— Я дивився телевізор, коли задзвонив телефон.</i></span>
      <span class="eq-ex"><b>They were playing football at 5 o'clock.</b> <i>— О 5 годині вони грали у футбол.</i></span>
      <p>Часто вживається з <b>while</b> (поки) та <b>when</b> (коли).</p>
    `},
    {title:"Перший умовний спосіб (First Conditional)", level:"B1", body:`
      <p>Використовується для реальних, можливих ситуацій у майбутньому.</p>
      <p>Форма: <b>If + Present Simple, ... will + дієслово</b>.</p>
      <span class="eq-ex"><b>If it rains, I will stay at home.</b> <i>— Якщо піде дощ, я залишуся вдома.</i></span>
      <span class="eq-ex"><b>If you study hard, you will pass the exam.</b> <i>— Якщо ти вчитимешся старанно, ти складеш іспит.</i></span>
      <p>Замість <b>will</b> можна вживати <b>can</b>, <b>must</b>, <b>may</b> залежно від змісту.</p>
    `},
    {title:"Пасивний стан (Passive Voice)", level:"B1", body:`
      <p>Використовується, коли важливіша дія, а не той, хто її виконує.</p>
      <p>Форма: <b>am/is/are + дієслово-3 (Past Participle)</b>.</p>
      <span class="eq-ex"><b>English is spoken all over the world.</b> <i>— Англійською розмовляють у всьому світі.</i></span>
      <span class="eq-ex"><b>This house was built in 1990.</b> <i>— Цей будинок був побудований у 1990 році.</i></span>
      <p>Виконавця дії можна додати через <b>by</b>: <i>The letter was written by Anna.</i></p>
    `},
    {title:"Означальні речення: who / which / that", level:"B1", body:`
      <p>Використовуються, щоб описати іменник докладніше.</p>
      <ul>
        <li><b>who</b> — для людей: <i>the man who lives next door</i></li>
        <li><b>which</b> — для предметів/тварин: <i>the book which I read</i></li>
        <li><b>that</b> — для людей і предметів (розмовний варіант): <i>the film that I watched</i></li>
      </ul>
      <span class="eq-ex"><b>She is the teacher who helped me.</b> <i>— Вона вчителька, яка мені допомогла.</i></span>
    `},
    {title:"Непряма мова (Reported Speech)", level:"B1", body:`
      <p>Використовується, щоб переказати чужі слова. Час дієслова зазвичай зсувається на один крок назад.</p>
      <span class="eq-ex"><b>"I am tired," she said.</b> → <b>She said she was tired.</b> <i>— Вона сказала, що втомилася.</i></span>
      <span class="eq-ex"><b>"I will call you," he said.</b> → <b>He said he would call me.</b> <i>— Він сказав, що подзвонить мені.</i></span>
      <p>Present Simple → Past Simple, Present Continuous → Past Continuous, will → would.</p>
    `},
    {title:"Used to", level:"B1", body:`
      <p>Використовується для звичок або станів у минулому, які вже не актуальні.</p>
      <p>Форма: <b>used to + дієслово</b> (базова форма).</p>
      <span class="eq-ex"><b>I used to live in Lviv.</b> <i>— Я раніше жив у Львові (а зараз ні).</i></span>
      <span class="eq-ex"><b>She didn't use to like coffee.</b> <i>— Вона раніше не любила каву.</i></span>
      <p>Не плутати з <b>to be used to</b> (звикнути до чогось).</p>
    `},
    {title:"Герундій чи інфінітив (-ing чи to)", level:"B1", body:`
      <p>Деякі дієслова вимагають після себе <b>-ing</b> форму, інші — <b>to + дієслово</b>.</p>
      <ul>
        <li>+ -ing: enjoy, like, finish, avoid, stop, suggest — <i>I enjoy reading.</i></li>
        <li>+ to: want, decide, hope, plan, promise, agree — <i>I want to travel.</i></li>
      </ul>
      <span class="eq-ex"><b>She stopped smoking last year.</b> <i>— Вона кинула палити торік.</i></span>
    `},
    {title:"Поширені фразові дієслова", level:"B1", body:`
      <ul>
        <li><b>to give up</b> — здаватися, кидати щось</li>
        <li><b>to look after</b> — доглядати</li>
        <li><b>to find out</b> — дізнатися</li>
        <li><b>to look forward to</b> — з нетерпінням чекати</li>
        <li><b>to get on with</b> — ладнати з кимось</li>
        <li><b>to run out of</b> — закінчуватися (про запаси)</li>
        <li><b>to turn down</b> — відхиляти (пропозицію)</li>
      </ul>
      <span class="eq-ex"><b>I'm looking forward to the holidays.</b> <i>— Я з нетерпінням чекаю на канікули.</i></span>
    `}
  ];
  THEORY.sort(byLevel);

  // ---------- state ----------
  const state = {
    theme: localStorage.getItem("eq-theme") || "light",
    voiceGender: localStorage.getItem("eq-voice-gender") || "female",
    view: "picker", // picker | posPicker | study | quiz | summary | theoryList | theoryArticle | dictionary | readingList | readingText | progress
    returnView: "picker",
    dictQuery: "",
    dictLevel: "all",
    posLevel: "all",
    posQuery: "",
    readingIndex: 0,
    showTranslation: false,
    topic: null,
    blocks: [],
    blockIndex: 0,
    blockItems: [],
    direction: "en-ua", // en-ua | ua-en
    pool: [],
    index: 0,
    score: 0,
    missed: [],
    answered: false,
    current: null,
    options: [],
    theoryIndex: 0
  };

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function makeLevelBadge(level){
    const badge = document.createElement("span");
    badge.className = "eq-level-badge lvl-" + level.toLowerCase();
    badge.textContent = level;
    return badge;
  }
  function levelBadge(it){ return makeLevelBadge(it[3] || "A2"); }

  let cachedVoices = [];
  function refreshVoices(){
    if("speechSynthesis" in window) cachedVoices = window.speechSynthesis.getVoices();
  }
  if("speechSynthesis" in window){
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  // Prefer a real native English voice over whatever the browser
  // would otherwise default to (which can silently be a voice for a
  // different language, reading English with the wrong phonetics).
  function pickEnglishVoice(){
    if(!cachedVoices.length) refreshVoices();
    const en = cachedVoices.filter(v=> v.lang && v.lang.toLowerCase().startsWith("en"));
    if(!en.length) return null;
    const byQuality = (v)=>
      /google us english|microsoft (aria|jenny|guy|zira|david)|samantha|daniel|natural/i.test(v.name) ? 3 :
      v.lang.toLowerCase() === "en-us" ? 2 :
      v.localService ? 1 : 0;
    return en.slice().sort((a,b)=> byQuality(b) - byQuality(a))[0];
  }
  // Kept alive on purpose: some Android Chrome builds silently drop the
  // utterance if it's garbage-collected before speech finishes.
  let currentUtterance = null;
  function speakBrowser(text){
    if(!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickEnglishVoice();
    if(voice){ u.voice = voice; u.lang = voice.lang; }
    else { u.lang = "en-US"; }
    u.rate = 0.9;
    u.pitch = 1;
    currentUtterance = u;
    // Android Chrome can silently drop speak() if it's called in the same
    // tick as cancel() — a short delay avoids that race.
    setTimeout(()=>{ window.speechSynthesis.speak(u); }, 60);
  }

  // Slug must match the Python generator's slugify() exactly: strip
  // diacritics, lowercase, collapse anything non a-z0-9 into "_".
  function audioSlug(text){
    const stripped = text.normalize("NFKD").replace(/[̀-ͯ]/g, "");
    const slug = stripped.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    return slug || "word";
  }
  let currentAudioEl = null;
  function stopSpeech(){
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    currentUtterance = null;
    if(currentAudioEl){ currentAudioEl.pause(); currentAudioEl.currentTime = 0; currentAudioEl = null; }
  }
  function speakEnglish(text){
    stopSpeech();
    if(state.voiceGender === "male"){
      const audio = new Audio("audio/" + audioSlug(text) + ".mp3");
      currentAudioEl = audio;
      audio.addEventListener("ended", ()=>{ if(currentAudioEl === audio) currentAudioEl = null; });
      audio.addEventListener("error", ()=>{ if(currentAudioEl === audio) currentAudioEl = null; speakBrowser(text); });
      audio.play().catch(()=>{ if(currentAudioEl === audio) currentAudioEl = null; speakBrowser(text); });
      return;
    }
    speakBrowser(text);
  }

  const BLOCK_SIZE = 15;

  function chunk(arr, size){
    const out = [];
    for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i, i+size));
    return out;
  }

  function startQuiz(topic, fromView){
    state.returnView = fromView || state.view;
    state.topic = topic;
    state.blocks = chunk(shuffle(topic.items), BLOCK_SIZE);
    startBlock(0);
  }

  function startBlock(i){
    state.blockIndex = i;
    state.blockItems = shuffle(state.blocks[i]);
    state.view = "study";
    render();
  }

  function startBlockQuiz(){
    state.pool = shuffle(state.blockItems);
    state.index = 0;
    state.score = 0;
    state.missed = [];
    state.view = "quiz";
    nextQuestion();
  }

  function nextQuestion(){
    if(state.index >= state.pool.length){
      recordActivity();
      state.view = "summary";
      render();
      return;
    }
    const item = state.pool[state.index];
    state.current = item;
    state.answered = false;
    const sourcePool = state.topic.items.length >= 4 ? state.topic.items : DICTIONARY;
    const others = sourcePool.filter(it=>it!==item);
    const distractors = shuffle(others).slice(0,3);
    state.options = shuffle([item, ...distractors]);
    render();
  }

  function answer(opt){
    if(state.answered) return;
    state.answered = true;
    const correct = opt === state.current;
    if(correct) state.score++;
    else { state.missed.push(state.current); recordMistake(state.current); }
    render();
  }

  function handleNext(){
    state.index++;
    nextQuestion();
  }

  // ---------- render ----------
  function render(){
    root.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "eq-root";
    wrap.dataset.theme = state.theme;
    root.appendChild(wrap);

    const top = document.createElement("div"); top.className = "eq-top";
    const stopBtn = document.createElement("button"); stopBtn.className = "eq-icon-btn";
    stopBtn.title = "Зупинити озвучення";
    stopBtn.textContent = "⏹";
    stopBtn.onclick = stopSpeech;
    const voiceBtn = document.createElement("button"); voiceBtn.className = "eq-icon-btn";
    voiceBtn.title = state.voiceGender === "male" ? "Голос: чоловічий (натисніть для жіночого)" : "Голос: жіночий (натисніть для чоловічого)";
    voiceBtn.textContent = state.voiceGender === "male" ? "👨" : "👩";
    voiceBtn.onclick = ()=>{ state.voiceGender = state.voiceGender === "male" ? "female" : "male"; localStorage.setItem("eq-voice-gender", state.voiceGender); render(); };
    const themeBtn = document.createElement("button"); themeBtn.className = "eq-icon-btn"; themeBtn.textContent = state.theme === "dark" ? "☀️" : "🌙";
    themeBtn.onclick = ()=>{ state.theme = state.theme === "dark" ? "light" : "dark"; localStorage.setItem("eq-theme", state.theme); render(); };
    top.appendChild(stopBtn); top.appendChild(voiceBtn); top.appendChild(themeBtn);
    wrap.appendChild(top);

    if(state.view === "picker") renderPicker(wrap);
    else if(state.view === "posPicker") renderPosPicker(wrap);
    else if(state.view === "overview") renderOverview(wrap);
    else if(state.view === "study") renderStudy(wrap);
    else if(state.view === "quiz") renderQuiz(wrap);
    else if(state.view === "summary") renderSummary(wrap);
    else if(state.view === "theoryList") renderTheoryList(wrap);
    else if(state.view === "theoryArticle") renderTheoryArticle(wrap);
    else if(state.view === "dictionary") renderDictionary(wrap);
    else if(state.view === "readingList") renderReadingList(wrap);
    else if(state.view === "readingText") renderReadingText(wrap);
    else if(state.view === "progress") renderProgress(wrap);
  }

  const MODE_TABS = [
    {views:["picker"], label:"За темами", go:"picker"},
    {views:["posPicker"], label:"За частинами мови", go:"posPicker"},
    {views:["theoryList","theoryArticle"], label:"Теорія", go:"theoryList"},
    {views:["dictionary"], label:"Словник", go:"dictionary"},
    {views:["readingList","readingText"], label:"Читання", go:"readingList"},
    {views:["progress"], label:"Прогрес", go:"progress"}
  ];
  function renderModeTabs(wrap){
    const tabs = document.createElement("div"); tabs.className = "eq-tabs";
    MODE_TABS.forEach(t=>{
      const btn = document.createElement("button");
      btn.className = "eq-tab" + (t.views.indexOf(state.view)!==-1 ? " active" : "");
      btn.textContent = t.label;
      btn.onclick = ()=>{ state.view = t.go; render(); };
      tabs.appendChild(btn);
    });
    wrap.appendChild(tabs);
  }

  function renderDirToggle(wrap){
    const dirRow = document.createElement("div"); dirRow.className = "eq-dirtoggle";
    const b1 = document.createElement("button"); b1.className = "eq-dirbtn" + (state.direction==="en-ua"?" active":""); b1.textContent = "EN → UA";
    b1.onclick = ()=>{ state.direction = "en-ua"; render(); };
    const b2 = document.createElement("button"); b2.className = "eq-dirbtn" + (state.direction==="ua-en"?" active":""); b2.textContent = "UA → EN";
    b2.onclick = ()=>{ state.direction = "ua-en"; render(); };
    dirRow.appendChild(b1); dirRow.appendChild(b2);
    wrap.appendChild(dirRow);
  }

  const LEVEL_FILTER_OPTIONS = [["all","Усі"],["A1","A1"],["A2","A2"],["B1","B1"],["B2","B2"],["C1","C1"]];
  function renderLevelToggle(wrap, current, onSelect){
    const row = document.createElement("div"); row.className = "eq-dirtoggle";
    LEVEL_FILTER_OPTIONS.forEach(([val,label])=>{
      const btn = document.createElement("button"); btn.className = "eq-dirbtn" + (current===val?" active":""); btn.textContent = label;
      btn.onclick = ()=> onSelect(val);
      row.appendChild(btn);
    });
    wrap.appendChild(row);
  }
  function filterTopicByLevel(topic, level){
    if(level === "all") return topic;
    return {slug: topic.slug, label: topic.label, grammar: topic.grammar, items: topic.items.filter(it=> (it[3]||"A2") === level)};
  }

  function renderTopicGrid(wrap, topics, fromView){
    const grid = document.createElement("div"); grid.className = "eq-grid";
    topics.forEach(topic=>{
      const tile = document.createElement("button"); tile.className = "eq-tile";
      const name = document.createElement("div"); name.className = "eq-tile-name"; name.textContent = topic.label;
      const count = document.createElement("div"); count.className = "eq-tile-count"; count.textContent = topic.items.length + " слів";
      tile.appendChild(name); tile.appendChild(count);
      tile.onclick = ()=> showOverview(topic, fromView);
      grid.appendChild(tile);
    });
    wrap.appendChild(grid);
  }

  function showOverview(topic, fromView){
    state.topic = topic;
    state.returnView = fromView || state.view;
    state.view = "overview";
    render();
  }

  function renderOverview(wrap){
    const back = document.createElement("button"); back.className = "eq-back"; back.textContent = "← Назад до тем";
    back.onclick = ()=>{ state.view = state.returnView; render(); };
    wrap.appendChild(back);

    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = state.topic.label;
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = "Усі слова теми";
    wrap.appendChild(kicker); wrap.appendChild(title);

    renderDirToggle(wrap);

    const enFirst = state.direction === "en-ua";
    const list = document.createElement("div"); list.className = "eq-study-list";
    state.topic.items.forEach(it=>{
      const row = document.createElement("div"); row.className = "eq-study-item";
      const frontRow = document.createElement("span"); frontRow.className = "eq-study-front-row";
      const front = document.createElement("span"); front.className = "eq-study-front"; front.textContent = enFirst ? it[0] : it[1];
      frontRow.appendChild(front);

    wrap.appendChild(list);

    start.onclick = ()=> startQuiz(state.topic, state.returnView);
    btnrow.appendChild(start);
    wrap.appendChild(btnrow);
  }

  const THEME_TOPICS = TOPICS.filter(t=> !t.grammar);
  const GRAMMAR_BLOCKS = TOPICS.filter(t=> t.grammar && t.slug !== "verbs" && t.slug !== "adjectives");

  function renderPicker(wrap){
    renderModeTabs(wrap);
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Англійська · рівень A2–B1";

    wrap.appendChild(kicker); wrap.appendChild(title);
    renderDirToggle(wrap);
    renderTopicGrid(wrap, THEME_TOPICS, "picker");

  const POS_LABELS = {n:"іменник", v:"дієслово", adj:"прикметник", other:"інше"};

  function renderPosPicker(wrap){
    renderModeTabs(wrap);
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Англійська · рівень A2–B1";

    wrap.appendChild(kicker); wrap.appendChild(title);
    renderDirToggle(wrap);

    const search = document.createElement("input"); search.type = "text"; search.className = "eq-search";
    search.placeholder = "Пошук слова англійською або українською…";
    search.value = state.posQuery;
    search.id = "eq-pos-search";
    search.oninput = (e)=>{ state.posQuery = e.target.value; render(); const el = document.getElementById("eq-pos-search"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
    wrap.appendChild(search);

    const levelLabel = document.createElement("p"); levelLabel.className = "eq-missed-title"; levelLabel.textContent = "Рівень слів";
    wrap.appendChild(levelLabel);
    renderLevelToggle(wrap, state.posLevel, (val)=>{ state.posLevel = val; render(); });

    const q = state.posQuery.trim().toLowerCase();
    if(q){
      const byQuery = DICTIONARY.filter(it=> it[0].toLowerCase().indexOf(q)!==-1 || it[1].toLowerCase().indexOf(q)!==-1);
      const results = state.posLevel === "all" ? byQuery : byQuery.filter(it=> (it[3]||"A2") === state.posLevel);
      const count = document.createElement("p"); count.className = "eq-dict-count"; count.style.marginTop = "20px"; count.textContent = results.length + " слів знайдено";
      wrap.appendChild(count);

      const list = document.createElement("div"); list.className = "eq-study-list";
      results.slice(0, 200).forEach(it=>{
        const row = document.createElement("div"); row.className = "eq-study-item eq-dict-item";
        const frontRow = document.createElement("span"); frontRow.className = "eq-study-front-row";
        const front = document.createElement("span"); front.className = "eq-study-front"; front.textContent = it[0];
        frontRow.appendChild(front);
        const posTag = document.createElement("span"); posTag.className = "eq-pos-tag"; posTag.textContent = POS_LABELS[it[2]] || "";
        frontRow.appendChild(posTag);
        frontRow.appendChild(levelBadge(it));
        const back = document.createElement("span"); back.className = "eq-study-back"; back.textContent = it[1];
        const speakBtn = document.createElement("button"); speakBtn.className = "eq-study-speak"; speakBtn.textContent = "🔊"; speakBtn.title = "Прослухати";
        speakBtn.onclick = ()=> speakEnglish(it[0]);
        row.appendChild(frontRow); row.appendChild(back); row.appendChild(speakBtn);
        list.appendChild(row);
      });
      wrap.appendChild(list);
      return;
    }

    const filteredPos = POS_TOPICS.map(t=> filterTopicByLevel(t, state.posLevel)).filter(t=> t.items.length > 0);
    const filteredBlocks = GRAMMAR_BLOCKS.map(t=> filterTopicByLevel(t, state.posLevel)).filter(t=> t.items.length > 0);

    const generalLabel = document.createElement("p"); generalLabel.className = "eq-missed-title"; generalLabel.style.marginTop = "24px"; generalLabel.textContent = "Загальні категорії (усі слова разом)";
    wrap.appendChild(generalLabel);
    if(filteredPos.length) renderTopicGrid(wrap, filteredPos, "posPicker");
    else { const empty = document.createElement("p"); empty.className = "eq-dict-count"; empty.textContent = "Немає слів цього рівня в цій категорії."; wrap.appendChild(empty); }

    const blocksLabel = document.createElement("p"); blocksLabel.className = "eq-missed-title"; blocksLabel.style.marginTop = "24px"; blocksLabel.textContent = "Окремі блоки";
    wrap.appendChild(blocksLabel);
    if(filteredBlocks.length) renderTopicGrid(wrap, filteredBlocks, "posPicker");
    else { const empty = document.createElement("p"); empty.className = "eq-dict-count"; empty.textContent = "Немає слів цього рівня в цій категорії."; wrap.appendChild(empty); }
  }

  function blockLabel(){
    return state.blocks.length > 1 ? " · блок " + (state.blockIndex+1) + "/" + state.blocks.length : "";
  }

  function renderStudy(wrap){
    const back = document.createElement("button"); back.className = "eq-back"; back.textContent = "← Назад до тем";
    back.onclick = ()=>{ state.view = state.returnView; render(); };
    wrap.appendChild(back);

    const kicker = document.createElement("p"); kicker.className = "eq-kicker";
    kicker.textContent = state.topic.label + blockLabel();
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = "Ознайомлення зі словами";
    wrap.appendChild(kicker); wrap.appendChild(title);

    renderDirToggle(wrap);

    const enFirst = state.direction === "en-ua";
    const list = document.createElement("div"); list.className = "eq-study-list";
    state.blockItems.forEach(it=>{
      const row = document.createElement("div"); row.className = "eq-study-item";
      const frontRow = document.createElement("span"); frontRow.className = "eq-study-front-row";
      const front = document.createElement("span"); front.className = "eq-study-front"; front.textContent = enFirst ? it[0] : it[1];
      frontRow.appendChild(front);
      frontRow.appendChild(levelBadge(it));
      const back = document.createElement("span"); back.className = "eq-study-back"; back.textContent = enFirst ? it[1] : it[0];
      const speakBtn = document.createElement("button"); speakBtn.className = "eq-study-speak"; speakBtn.textContent = "🔊"; speakBtn.title = "Прослухати";
      speakBtn.onclick = ()=> speakEnglish(it[0]);
      row.appendChild(frontRow); row.appendChild(back); row.appendChild(speakBtn);
      list.appendChild(row);
    });
    wrap.appendChild(list);

    const btnrow = document.createElement("div"); btnrow.className = "eq-btnrow";
    const start = document.createElement("button"); start.className = "eq-btn-primary"; start.textContent = "Почати перевірку →";
    start.onclick = startBlockQuiz;
    btnrow.appendChild(start);
    wrap.appendChild(btnrow);
  }

  function renderQuiz(wrap){
    const back = document.createElement("button"); back.className = "eq-back"; back.textContent = "← До ознайомлення";
    back.onclick = ()=>{ state.view = "study"; render(); };
    wrap.appendChild(back);

    renderDirToggle(wrap);

    const topbar = document.createElement("div"); topbar.className = "eq-topbar";
    const left = document.createElement("span"); left.textContent = state.topic.label + blockLabel();
    const right = document.createElement("span"); right.className = "eq-topbar-right";
    const scoreSpan = document.createElement("span"); scoreSpan.textContent = (state.index+1) + " / " + state.pool.length + " · рахунок: " + state.score;
    const starBtn = document.createElement("button"); starBtn.className = "eq-star" + (isFavorite(state.current) ? " active" : ""); starBtn.textContent = isFavorite(state.current) ? "★" : "☆"; starBtn.title = "Додати до обраного";
    starBtn.onclick = ()=>{ toggleFavorite(state.current); render(); };
    right.appendChild(scoreSpan); right.appendChild(starBtn);
    topbar.appendChild(left); topbar.appendChild(right);
    wrap.appendChild(topbar);

    const pbar = document.createElement("div"); pbar.className = "eq-progressbar";
    const pfill = document.createElement("div"); pfill.className = "eq-progressbar-fill";
    pfill.style.width = Math.round((state.index/state.pool.length)*100) + "%";
    pbar.appendChild(pfill);
    wrap.appendChild(pbar);

    const enFirst = state.direction === "en-ua";
    const promptText = enFirst ? state.current[0] : state.current[1];

    const label = document.createElement("p"); label.className = "eq-prompt-label";
    label.textContent = enFirst ? "Що означає це слово?" : "Як це буде англійською?";
    wrap.appendChild(label);

    const prompt = document.createElement("p"); prompt.className = "eq-prompt"; prompt.textContent = promptText;
    wrap.appendChild(prompt);

    if(enFirst || state.answered){
      const speakBtn = document.createElement("button"); speakBtn.className = "eq-speak";
      speakBtn.textContent = enFirst ? "🔊 Прослухати" : "🔊 Прослухати вимову";
      speakBtn.onclick = ()=> speakEnglish(state.current[0]);
      wrap.appendChild(speakBtn);
    }

    const opts = document.createElement("div"); opts.className = "eq-options";
    state.options.forEach(opt=>{
      const btn = document.createElement("button"); btn.className = "eq-opt";
      btn.textContent = enFirst ? opt[1] : opt[0];
      btn.disabled = state.answered;
      if(state.answered){
        if(opt === state.current) btn.classList.add("correct");
        else if(btn.dataset.picked) btn.classList.add("wrong");
      }
      btn.onclick = ()=>{ btn.dataset.picked = "1"; answer(opt); };
      opts.appendChild(btn);
    });
    wrap.appendChild(opts);

    const nextbar = document.createElement("div"); nextbar.className = "eq-nextbar";
    const nextBtn = document.createElement("button"); nextBtn.className = "eq-next"; nextBtn.textContent = "Далі →";
    nextBtn.disabled = !state.answered;
    nextBtn.onclick = handleNext;
    nextbar.appendChild(nextBtn);
    wrap.appendChild(nextbar);
  }

  function renderSummary(wrap){
    const isLastBlock = state.blockIndex >= state.blocks.length - 1;
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = state.topic.label + blockLabel();
    const title = document.createElement("h2"); title.className = "eq-title";
    title.textContent = state.blocks.length > 1 ? "Блок завершено" : "Порція завершена";
    wrap.appendChild(kicker); wrap.appendChild(title);

    const score = document.createElement("div"); score.className = "eq-summary-score";
    score.textContent = state.score + " / " + state.pool.length;
    wrap.appendChild(score);

    if(state.missed.length){
      const mt = document.createElement("div"); mt.className = "eq-missed-title"; mt.textContent = "Варто повторити:";
      wrap.appendChild(mt);
      state.missed.forEach(it=>{
        const row = document.createElement("div"); row.className = "eq-missed-item";
        const en = document.createElement("span"); en.textContent = it[0];
        const ua = document.createElement("span"); ua.textContent = it[1];
        row.appendChild(en); row.appendChild(ua);
        wrap.appendChild(row);
      });
    }

    const btnrow = document.createElement("div"); btnrow.className = "eq-btnrow";
    const again = document.createElement("button"); again.className = "eq-btn-secondary"; again.textContent = "Повторити цей блок";
    again.onclick = ()=> startBlock(state.blockIndex);
    btnrow.appendChild(again);
    if(!isLastBlock){
      const nextBlockBtn = document.createElement("button"); nextBlockBtn.className = "eq-btn-primary"; nextBlockBtn.textContent = "Наступний блок →";
      nextBlockBtn.onclick = ()=> startBlock(state.blockIndex + 1);
      btnrow.appendChild(nextBlockBtn);
    }
    const toPicker = document.createElement("button"); toPicker.className = "eq-btn-secondary"; toPicker.textContent = "Назад до тем";
    toPicker.onclick = ()=>{ state.view = state.returnView; render(); };
    btnrow.appendChild(toPicker);
    wrap.appendChild(btnrow);
  }

  function renderTheoryList(wrap){
    renderModeTabs(wrap);
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Англійська · рівень A2–B1";
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = "Базова граматика";
    wrap.appendChild(kicker); wrap.appendChild(title);

    THEORY.forEach((topic, i)=>{
      const item = document.createElement("button"); item.className = "eq-theory-list-item";
      const row = document.createElement("span"); row.className = "eq-theory-list-row";
      const text = document.createElement("span"); text.textContent = (i+1) + ". " + topic.title;
      row.appendChild(text);

      item.appendChild(row);

      wrap.appendChild(item);

  function renderTheoryArticle(wrap){
    const back = document.createElement("button"); back.className = "eq-back"; back.textContent = "← Усі теми";
    back.onclick = ()=>{ state.view = "theoryList"; render(); };
    wrap.appendChild(back);

    const topic = THEORY[state.theoryIndex];
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Теорія";
    const titleRow = document.createElement("div"); titleRow.className = "eq-title-row";
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = topic.title;
    titleRow.appendChild(title);
    titleRow.appendChild(makeLevelBadge(topic.level || "A2"));

    const article = document.createElement("div"); article.className = "eq-theory-article";
    article.innerHTML = topic.body;
    wrap.appendChild(article);

    const nav = document.createElement("div"); nav.className = "eq-btnrow";
    if(state.theoryIndex > 0){
      const prev = document.createElement("button"); prev.className = "eq-btn-secondary"; prev.textContent = "← Попередня";
      prev.onclick = ()=>{ state.theoryIndex--; render(); };
      nav.appendChild(prev);

    if(state.theoryIndex < THEORY.length - 1){
      const next = document.createElement("button"); next.className = "eq-btn-primary"; next.textContent = "Наступна →";
      next.onclick = ()=>{ state.theoryIndex++; render(); };
      nav.appendChild(next);

  function renderDictionary(wrap){
    renderModeTabs(wrap);
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Англійська · рівень A2–B1";
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = "Словник";
    wrap.appendChild(kicker); wrap.appendChild(title);

    const search = document.createElement("input"); search.type = "text"; search.className = "eq-search";
    search.placeholder = "Пошук слова англійською або українською…";
    search.value = state.dictQuery;
    search.id = "eq-dict-search";
    search.oninput = (e)=>{ state.dictQuery = e.target.value; render(); const el = document.getElementById("eq-dict-search"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
    wrap.appendChild(search);

    renderLevelToggle(wrap, state.dictLevel, (val)=>{ state.dictLevel = val; render(); });

    const q = state.dictQuery.trim().toLowerCase();
    const byQuery = q ? DICTIONARY.filter(it=> it[0].toLowerCase().indexOf(q)!==-1 || it[1].toLowerCase().indexOf(q)!==-1) : DICTIONARY;
    const filtered = state.dictLevel === "all" ? byQuery : byQuery.filter(it=> (it[3]||"A2") === state.dictLevel);

    const count = document.createElement("p"); count.className = "eq-dict-count"; count.textContent = filtered.length + " із " + DICTIONARY.length + " слів";
    wrap.appendChild(count);

    const list = document.createElement("div"); list.className = "eq-study-list";
    filtered.slice(0, 200).forEach(it=>{
      const row = document.createElement("div"); row.className = "eq-study-item eq-dict-item";
      const frontRow = document.createElement("span"); frontRow.className = "eq-study-front-row";
      const front = document.createElement("span"); front.className = "eq-study-front"; front.textContent = it[0];
      frontRow.appendChild(front);
      frontRow.appendChild(levelBadge(it));
      const back = document.createElement("span"); back.className = "eq-study-back"; back.textContent = it[1];
      const actions = document.createElement("span"); actions.className = "eq-dict-actions";
      const starBtn = document.createElement("button"); starBtn.className = "eq-star" + (isFavorite(it) ? " active" : ""); starBtn.textContent = isFavorite(it) ? "★" : "☆";
      starBtn.onclick = ()=>{ toggleFavorite(it); render(); };
      const speakBtn = document.createElement("button"); speakBtn.className = "eq-study-speak"; speakBtn.textContent = "🔊"; speakBtn.title = "Прослухати";
      speakBtn.onclick = ()=> speakEnglish(it[0]);
      actions.appendChild(starBtn); actions.appendChild(speakBtn);
      row.appendChild(frontRow); row.appendChild(back); row.appendChild(actions);
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if(filtered.length > 200){
      const more = document.createElement("p"); more.className = "eq-dict-count"; more.textContent = "Уточніть пошук, щоб побачити більше слів.";
      wrap.appendChild(more);
    }
  }

  function renderReadingList(wrap){
    renderModeTabs(wrap);
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Англійська · рівень A2–B1";
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = "Тексти для читання";
    wrap.appendChild(kicker); wrap.appendChild(title);

    READING.forEach((text, i)=>{
      const item = document.createElement("button"); item.className = "eq-reading-list-item";
      const label = document.createElement("span"); label.textContent = text.title + " — " + text.titleUa;
      item.appendChild(label);
      item.appendChild(makeLevelBadge(text.level || "A2"));
      item.onclick = ()=>{ state.readingIndex = i; state.showTranslation = false; state.view = "readingText"; render(); };
      wrap.appendChild(item);
    });
  }

  function renderReadingText(wrap){
    const back = document.createElement("button"); back.className = "eq-back"; back.textContent = "← Усі тексти";
    back.onclick = ()=>{ state.view = "readingList"; render(); };
    wrap.appendChild(back);

    const text = READING[state.readingIndex];
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Читання";
    const titleRow = document.createElement("div"); titleRow.className = "eq-title-row";
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = text.title;
    titleRow.appendChild(title);
    titleRow.appendChild(makeLevelBadge(text.level || "A2"));
    wrap.appendChild(kicker); wrap.appendChild(titleRow);

    const article = document.createElement("div"); article.className = "eq-theory-article";
    text.en.forEach((sentence, i)=>{
      const p = document.createElement("p"); p.textContent = sentence;
      article.appendChild(p);
      if(state.showTranslation){
        const ua = document.createElement("p"); ua.className = "eq-reading-ua"; ua.textContent = text.ua[i];
        article.appendChild(ua);
      }
    });
    wrap.appendChild(article);

    const btnrow = document.createElement("div"); btnrow.className = "eq-btnrow";
    const speakAll = document.createElement("button"); speakAll.className = "eq-btn-secondary"; speakAll.textContent = "🔊 Прослухати текст";
    speakAll.onclick = ()=> speakEnglish(text.en.join(" "));
    const toggleBtn = document.createElement("button"); toggleBtn.className = "eq-btn-secondary";
    toggleBtn.textContent = state.showTranslation ? "Сховати переклад" : "Показати переклад";
    toggleBtn.onclick = ()=>{ state.showTranslation = !state.showTranslation; render(); };
    btnrow.appendChild(speakAll); btnrow.appendChild(toggleBtn);
    wrap.appendChild(btnrow);

    const vocabTitle = document.createElement("p"); vocabTitle.className = "eq-missed-title"; vocabTitle.style.marginTop = "26px"; vocabTitle.textContent = "Ключові слова:";
    wrap.appendChild(vocabTitle);
    const list = document.createElement("div"); list.className = "eq-study-list";
    text.vocab.forEach(it=>{
      const row = document.createElement("div"); row.className = "eq-study-item";
      const front = document.createElement("span"); front.className = "eq-study-front"; front.textContent = it[0];
      const back = document.createElement("span"); back.className = "eq-study-back"; back.textContent = it[1];
      const speakBtn = document.createElement("button"); speakBtn.className = "eq-study-speak"; speakBtn.textContent = "🔊";
      speakBtn.onclick = ()=> speakEnglish(it[0]);
      row.appendChild(front); row.appendChild(back); row.appendChild(speakBtn);
      list.appendChild(row);
    });
    wrap.appendChild(list);

    const nav = document.createElement("div"); nav.className = "eq-btnrow";
    if(state.readingIndex > 0){
      const prev = document.createElement("button"); prev.className = "eq-btn-secondary"; prev.textContent = "← Попередній текст";
      prev.onclick = ()=>{ state.readingIndex--; state.showTranslation = false; render(); };
      nav.appendChild(prev);
    }
    if(state.readingIndex < READING.length - 1){
      const next = document.createElement("button"); next.className = "eq-btn-primary"; next.textContent = "Наступний текст →";
      next.onclick = ()=>{ state.readingIndex++; state.showTranslation = false; render(); };
      nav.appendChild(next);
    }
    if(nav.children.length) wrap.appendChild(nav);
  }

  function renderCalendar(wrap){
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
    const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];

    const label = document.createElement("p"); label.className = "eq-missed-title"; label.textContent = monthNames[month] + " " + year;
    wrap.appendChild(label);

    const grid = document.createElement("div"); grid.className = "eq-cal-grid";
    ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].forEach(w=>{
      const h = document.createElement("div"); h.className = "eq-cal-head"; h.textContent = w;
      grid.appendChild(h);
    });
    for(let i=0;i<firstWeekday;i++){
      const pad = document.createElement("div"); pad.className = "eq-cal-pad";
      grid.appendChild(pad);
    }
    for(let d=1; d<=daysInMonth; d++){
      const key = year + "-" + String(month+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      const cell = document.createElement("div");
      cell.className = "eq-cal-cell" + (progress.days[key] ? " active" : "") + (d === now.getDate() ? " today" : "");
      cell.textContent = d;
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
  }

  function renderProgress(wrap){
    renderModeTabs(wrap);
    const kicker = document.createElement("p"); kicker.className = "eq-kicker"; kicker.textContent = "Англійська · рівень A2–B1";
    const title = document.createElement("h1"); title.className = "eq-title"; title.textContent = "Прогрес";
    wrap.appendChild(kicker); wrap.appendChild(title);

    const streak = computeStreak();
    const streakBox = document.createElement("div"); streakBox.className = "eq-streak-box";
    const streakNum = document.createElement("div"); streakNum.className = "eq-summary-score"; streakNum.style.margin = "0"; streakNum.textContent = streak;
    const streakLabel = document.createElement("div"); streakLabel.className = "eq-dict-count"; streakLabel.textContent = "днів поспіль";
    streakBox.appendChild(streakNum); streakBox.appendChild(streakLabel);
    wrap.appendChild(streakBox);

    const totalLabel = document.createElement("p"); totalLabel.className = "eq-dict-count"; totalLabel.style.textAlign = "center"; totalLabel.style.marginBottom = "20px";
    totalLabel.textContent = "Усього днів практики: " + totalPracticeDays();
    wrap.appendChild(totalLabel);

    renderCalendar(wrap);

    const fav = favoriteItems();
    const favSection = document.createElement("div"); favSection.className = "eq-progress-section";
    const favTitle = document.createElement("p"); favTitle.className = "eq-missed-title"; favTitle.textContent = "★ Обране (" + fav.length + ")";
    favSection.appendChild(favTitle);
    if(fav.length){
      const favBtn = document.createElement("button"); favBtn.className = "eq-btn-primary"; favBtn.textContent = "Практикувати обране";
      favBtn.onclick = ()=> startQuiz({slug:"favorites", label:"Обране", items: fav}, "progress");
      favSection.appendChild(favBtn);
    } else {
      const empty = document.createElement("p"); empty.className = "eq-dict-count"; empty.textContent = "Натисніть ☆ біля слова в тесті або словнику, щоб додати його сюди.";
      favSection.appendChild(empty);
    }
    wrap.appendChild(favSection);

    const mistakes = mistakeItems();
    const mistSection = document.createElement("div"); mistSection.className = "eq-progress-section";
    const mistTitle = document.createElement("p"); mistTitle.className = "eq-missed-title"; mistTitle.textContent = "Слова з помилками (" + mistakes.length + ")";
    mistSection.appendChild(mistTitle);
    if(mistakes.length){
      const mistBtn = document.createElement("button"); mistBtn.className = "eq-btn-primary"; mistBtn.textContent = "Практикувати помилки";
      mistBtn.onclick = ()=> startQuiz({slug:"mistakes", label:"Помилки", items: mistakes}, "progress");
      mistSection.appendChild(mistBtn);
      mistakes.slice(0,10).forEach(it=>{
        const row = document.createElement("div"); row.className = "eq-missed-item";
        const en = document.createElement("span"); en.textContent = it[0];
        const ua = document.createElement("span"); ua.textContent = it[1] + " · ×" + progress.mistakes[wordId(it)];
        row.appendChild(en); row.appendChild(ua);
        mistSection.appendChild(row);
      });
    } else {
      const empty = document.createElement("p"); empty.className = "eq-dict-count"; empty.textContent = "Поки що немає помилок — чудовий результат!";
      mistSection.appendChild(empty);
    }
    wrap.appendChild(mistSection);
  }

  render();
})();</script>
</body>
</html>
